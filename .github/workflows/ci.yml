name: ci

# ⚠️ 容器里的默认 shell 是 **sh**（不是 bash）⇒ `source` 不是命令，步骤会以 127 失败（实测）。
defaults:
  run:
    shell: bash

# 门禁：能干净构建 + 全量 colcon test 绿；另有两条**独立** job（失败原因不同，混在一起看不出是谁）。
#   - sanitizers：ASan/UBSan + TSan（要重编两遍，慢）
#   - sim-smoke：Gazebo headless 冒烟（要 ~1 GB 内存 + GL，精度依赖物理 ⇒ 不并进 colcon test）
# 依赖安装、失败上报都只有**一份**：`.github/actions/setup-ros` 与 `scripts/ci_run.sh`。
#
# 还没做的（见 README 的"改进方向"）：
#   1. lint 未进门禁 —— 仓库目前没配 ament_lint/.clang-format
#   2. 没做依赖缓存 —— rosdep 每次会重拉 MoveIt/Nav2；可换 ros-tooling/setup-ros
#   3. 没做版本/CHANGELOG 的 tag

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # 固定域 + 限本机：runner 上 DDS 组播不稳，这样行为才可复现。
  ROS_DOMAIN_ID: "42"
  ROS_LOCALHOST_ONLY: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ros

      # 最便宜的一关先跑：纯文本检查，不用装依赖、不用构建（政策见 docs/contract.md）。
      - name: 契约检查（版本一致 + 接口只增不删）
        run: python3 scripts/check_contract.py

      # 语义一致性：关节名单、控制器集合这些"同一概念的多份副本"必须对得上（见脚本头部）。
      - name: 仿真侧一致性检查
        run: python3 scripts/check_sim_consistency.py

      - name: 构建
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: 测试
        # ⚠️ 单 worker：Nav2 整栈与真栈（ros2_control + move_group）同时跑会互相挤，
        #    有几条探针按时序判定（真栈一条 ~30 s）。慢一点，但结论可信。
        run: ./scripts/ci_run.sh 测试 ./scripts/run_tests.sh --parallel-workers 1

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          if-no-files-found: ignore
          path: |
            log/
            build/**/test_results/

  # 独立 job：sanitizer 构建 + 跑核心测试。和主 job 分开是因为它要重编一遍（慢），
  # 而且失败原因完全不同（内存错误 / 数据竞争 vs 逻辑错误）。
  sanitizers:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ros

      - name: ASan + UBSan（内存错误 / 未定义行为）
        run: ./scripts/ci_run.sh ASan bash -c './scripts/build_sanitizers.sh address,undefined && ./scripts/run_sanitizer_tests.sh asan'

      - name: TSan（数据竞争）
        # TSan 在新内核/容器上会 FATAL: unexpected memory mapping ——
        # run_sanitizer_tests.sh 里先探测 `setarch -R`，不可用才退 sysctl。
        run: ./scripts/ci_run.sh TSan bash -c './scripts/build_sanitizers.sh thread && ./scripts/run_sanitizer_tests.sh tsan'

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          if-no-files-found: ignore
          path: |
            log/

  # 独立 job：Gazebo headless 冒烟。为什么不并进 colcon test 见 robot_sdk_gazebo/README。
  # 只验证"驱动链真的通了"（控制器 active / 里程计前进 / gz→ROS 桥有数据），不验证精度。
  sim-smoke:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ros
        with:
          render: "true"

      - name: 构建（仿真栈最少需要的那些包）
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-up-to robot_sdk_gazebo --event-handlers console_cohesion+

      - name: 冒烟（起 headless 仿真 + 断言驱动链）
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ./scripts/ci_run.sh 冒烟 ./scripts/run_sim_smoke.sh

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-smoke-logs
          if-no-files-found: ignore
          path: |
            log/sim-smoke-*.log
