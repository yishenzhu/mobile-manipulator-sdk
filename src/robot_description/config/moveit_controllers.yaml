# 告诉 move_group：「规划出来的轨迹交给谁去执行」。
#
# 没有这份文件时 move_group 会 warn「No controller_names specified」，
# 于是**只能规划、不能执行** —— 表现为 MoveGroup 回
# `-4 CONTROL_FAILED`（轨迹其实已经规划出来了，见 /move_action 的结果里
# `planned_trajectory` 有几十个点）。
#
# ⚠️ 这里配的控制器**不是** ros2_control，而是 `robot_sdk_sim` 里的
#    `joint_trajectory_mock` —— 一个假的关节轨迹控制器。
#    本机没装 ros2_control，而这条链路要验的是「SDK → 适配器 → MoveIt → 控制器」，
#    控制器是真货还是替身不影响这条链路的正确性。
#
# ⚠️⚠️ 动作名 = `<controller_name>/<action_ns>` = `/arm_controller/follow_joint_trajectory`。
#     起替身时必须让它监听同一个名字（它的 `action_name` 参数），否则
#     simple_controller_manager 会一直等，直到超时。
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    # default: true ⇒ 没点名控制器时就派给它（我们只有一个）。
    default: true
    # ⚠️ 这里只列 **arm 组自己的关节**（4 个）。
    #    simple_controller_manager 会把轨迹按这份名单筛一遍，
    #    而替身会拒绝「关节名和它对不上」的轨迹 —— 两边必须一致。
    #    ⚠️ 夹爪关节**不在**里面：它属于 gripper 组，动它是另一个控制器的事。
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_joint
