# 告诉 move_group「规划出来的轨迹交给谁执行」。缺了它 ⇒ 只能规划不能执行（回 -4）。
# 动作名 = `<controller_name>/<action_ns>` = `/arm_controller/follow_joint_trajectory`，
# 现在由真货（ros2_control）提供；`joint_trajectory_mock` 是测试替身，监听同名动作，别同时起。
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    # default: true ⇒ 没点名控制器时就派给它（我们只有一个）。
    default: true
    # arm 组的 6 个关节，必须和 ros2_control.yaml 的 arm_controller.joints 一致
    # （控制器会拒绝名字对不上的轨迹）。夹爪属于 gripper 组，不在这里。
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_joint
      - wrist_pitch_joint
      - wrist_roll_joint
