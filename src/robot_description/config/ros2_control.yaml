# ros2_control 的控制器配置：controller_manager 要跑多快、有哪几个控制器、各自控什么。
#
# 配合 URDF 里的 <ros2_control> 标签使用（那个标签声明硬件插件和接口，这里声明算法）。
#
# ⚠️ `joint_state_broadcaster` **必须**有：它才是发 `/joint_states` 的那个人。
#    少了它，robot_state_publisher 没关节状态 ⇒ TF 不全 ⇒ MoveIt 连不上机器人的当前姿态。
#    （之前那个角色由 `joint_trajectory_mock` 兼任；换成真 ros2_control 后归它管。）
#
# ⚠️ `update_rate` 与 URDF 无关，是 controller_manager 的调度周期。50 Hz 够用，
#    和之前那个替身的控制周期一致。
controller_manager:
  ros__parameters:
    update_rate: 50

    # ⚠️⚠️ 这个键**必须存在且非空**，否则控制器一个都加载不了 —— 而且症状极具误导性：
    #      硬件会正常打印 "Successful 'activate' of hardware"，
    #      但 `ros2 control list_controllers` 永远只说 "No controllers are currently loaded!"，
    #      控制器日志里则是：
    #          Controller 'xxx' node arguments: --ros-args --params-file      ← 后面是空的
    #          Couldn't parse trailing --params-file flag. No file path provided.
    #
    #    机制（实测出来的，不是猜的）：controller_manager 加载控制器时会把"启动它自己时用的
    #    那个 --params-file 文件"转发给控制器节点。而它**只在这份文件里存在 `params_file`
    #    这个键时**才做转发，否则转发出去的就是空字符串。
    #
    #    ⚠️ **值必须是"存在的绝对路径"**，这三档实测过：
    #       · 没有这个键                  ⇒ 转发空 ⇒ 失败
    #       · 值是相对路径（比如本文件名）⇒ 转发空 ⇒ 失败
    #       · 值是**存在的绝对路径**      ⇒ 转发成功 ⇒ 控制器 Loaded ✅
    #    可这份配置文件没法知道自己被装到哪儿，所以运行时由 launch 读出真实路径、
    #    补成绝对路径、写成临时副本再启动（见 launch/ros2_control.launch.py）。
    #    下面这个占位值运行时会被覆盖，它在这儿只是表明"这个键必须存在"。
    #
    #    ⚠️ 也别指望用 `ros2 run ... --ros-args -p params_file:=<绝对路径>` 代替：实测无效，
    #       参数是设上了，转发依旧为空 —— 它读的是文件里的键。
    params_file: "ros2_control.yaml"

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    # 5 个关节全发 —— 和 URDF 里 <ros2_control> 声明的保持一致。
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_joint
      - gripper_joint

arm_controller:
  ros__parameters:
    # ⚠️ 只控手臂这 4 个 —— 和 moveit_controllers.yaml 里那份名单**必须一致**
    #    （MoveIt 按那份名单发轨迹，这里按这份收）。夹爪是另一个控制器的事，暂时没有。
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    # ⚠️ 假硬件没有反馈回路，命令写进去、状态立刻就是它。
    #    不开这个的话控制器会等"实际位置跟上来"，而那个反馈在 mock_components 下
    #    是同一拍才更新的，白等一轮、还可能报 tolerance 超限。
    open_loop_control: true
