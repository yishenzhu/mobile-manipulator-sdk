# ros2_control 的控制器配置。配合 URDF 里的 <ros2_control> 标签（那个声明硬件和接口）。
# ⚠️ `joint_state_broadcaster` 必须有 —— 它才是发 `/joint_states` 的人，少了 TF 不全。
# `update_rate` 是 controller_manager 的调度周期，与 URDF 无关。
controller_manager:
  ros__parameters:
    update_rate: 50

    # ⚠️ 必须存在。controller_manager 拿它的值转发给控制器节点；空值或相对路径都会让
    #    控制器全部加载失败（症状：硬件 activate 成功，list_controllers 却说一个都没加载）。
    #    值必须是存在的**绝对路径**，所以运行时由 launch 生成副本补上，见那个 launch。
    params_file: "ros2_control.yaml"

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    # 底盘改走标准控制栈（原先由 gz 私有的 DiffDrive 插件驱动）。
    # ⚠️ 它**只收 TwistStamped**（Jazzy 起），话题是 ~/cmd_vel / ~/odom
    #    ⇒ 由 launch 里的 spawner 用 --controller-ros-args 重映射成 /cmd_vel、/odom。
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    # 7 个关节全发 —— 和 URDF 的 <ros2_control> 声明一致。
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_joint
      - wrist_pitch_joint
      - wrist_roll_joint
      - gripper_joint

arm_controller:
  ros__parameters:
    # 手臂 6 个，必须和 moveit_controllers.yaml 那份名单一致。
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    # 假硬件没有反馈回路：命令写进去状态立刻就是它。不开这个的话控制器会等"实际位置
    # 跟上来"，而那份反馈在 mock_components 下同一拍才更新 ⇒ 白等一轮、可能报超限。
    open_loop_control: true


# 底盘（差速）。轮距/半径必须和 URDF 里的几何**一致**：
# 2 * wheel_offset_y = 0.37、wheel_radius = 0.055，否则里程计会系统性偏。
diff_drive_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.37
    wheel_radius: 0.055
    odom_frame_id: odom
    base_frame_id: base_footprint
    # ⚠️ TF 仍由 robot_sdk_gazebo 的 odom_tf_broadcaster 独家发（它读 /odom 转成 TF）——
    #    这里再发一份就有两个作者改同一条 odom→base，TF 树会抖。
    enable_odom_tf: false
    publish_rate: 50.0
    # 仿真的车轮有真实位置反馈 ⇒ 用位置积分算里程；open_loop 只适合没有反馈的假硬件。
    position_feedback: true
    open_loop: false
    # 上位机（Nav2）偶尔抖动时，超时没新速度命令就当停车 —— 真底盘也这么处理，别一直冲。
    cmd_vel_timeout: 0.5
