# MoveIt 的**关节限位覆写**：给 `AddTimeOptimalParameterization` 算轨迹时间用。
# ⚠️ 文件必须存在且**内容不能空**，新增关节也必须补 —— 缺了后处理会失败，
#    MoveGroup 回 99999（看着像"规划失败"，其实是"规划成功、后处理失败"）。
joint_limits:
  shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  elbow_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  wrist_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  # 腕部后两段 —— 新增关节必须在这里补上（理由见文件头）。
  wrist_pitch_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  wrist_roll_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  gripper_joint:
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.2
