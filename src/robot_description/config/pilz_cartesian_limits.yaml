# Pilz 规划器的笛卡尔限值。只在用 Pilz（pipeline_id: pilz_industrial_motion_planner）时生效，
# 我们走 OMPL ⇒ 数值是惰性的；但**文件必须存在**（builder 会找它，缺了 launch 直接失败）。
# 数值参照 MoveIt 官方 Panda 示例，真要上机器人得按载重/工艺重定。
cartesian_limits:
  max_trans_vel: 1.0      # m/s
  max_trans_acc: 2.25     # m/s²   ← 笛卡尔加速度待的地方
  max_trans_dec: -5.0     # m/s²   减速度单独限（刹车一般比加速狠）
  max_rot_vel: 1.57       # rad/s
