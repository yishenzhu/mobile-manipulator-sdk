# MoveIt 的逆解配置：用哪个 IK 插件、给多少求解时间。
#
# 插件用 KDL —— 它是 MoveIt 自带的默认解算器（实测这个环境里
# `libmoveit_kdl_kinematics_plugin.so` 就在），而且是数值解，不需要额外的求解器依赖。
#
# ⚠️ 组名必须和 SRDF 里的 <group name="..."> 以及适配器的 planning_group 参数**一致** ——
#    三处对不上 MoveIt 会直接说"没有这个组"。
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05

gripper:
  # 夹爪是一个 prismatic 关节 —— 它没有"逆解"可言（平移不用迭代），
  # 但 MoveIt 要求每个组都有一条记录，缺了会在加载配置时抱怨。
  # 给同一个数值解算器即可，实际不会用到。
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
