# MoveIt 的逆解配置。KDL 是自带的默认解算器，数值解，无额外依赖。
# ⚠️ 组名必须和 SRDF 的 <group name> 以及适配器的 planning_group 一致，
#    三处对不上 MoveIt 会直接说"没有这个组"。
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # ⚠️ arm 组是 6 个 revolute（pan/lift/elbow + Z-Y-Z 球形腕）⇒ KDL 能解完整 6 维位姿。
  #    所以这里**必须**是 false：置 true 会白白放弃姿态，any_orientation=false 的目标
  #    就永远解不出朝向。
  position_only_ik: false
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
gripper:
  # 夹爪是 prismatic，没有"逆解"可言；但 MoveIt 要求每个组都有一条记录。
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
