# 让 Nav2 跑在 mock 机器人上。
# 帧名 map / odom / base_footprint，输入 /scan，输出 /cmd_vel（所以不起 velocity_smoother
# 和 collision_monitor，让 controller_server 直接发 cmd_vel）。

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # 单位是**毫秒**。参考那份写 20（＝0.02 s），发目标常常等不到回应。
    default_server_timeout: 200
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    # ⚠️ 必须发 TwistStamped：Jazzy 的 diff_drive_controller **只收** stamped
    #    （没有 use_stamped_vel 开关、也没有 unstamped 订阅）。Gazebo 那条链路的
    #    底盘就是它驱动的；mock 节点也按 stamped 收。
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    # 原地转正交给 shim，路径跟踪还是 RPP（shim 在内部把 RPP 造出来）。
    # 27c 那轮没有 shim，只能调大 max_angular_accel 顶上去（实发角速度 =
    # min(请求值, max_angular_accel ÷ 控制频率)）；现在转角速度由 shim 直接说了算。
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      # ⚠️ 这里要写**插件类名**，不是 controller_plugins 里的实例名 ——
      #    写错的话 shim 造不出内部控制器，controller_server 会直接段错误。
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 两层各管一段，门槛必须错开：shim 只管"朝向差很多"时原地转正（追**路径起点**朝向），
      # 误差小于此门槛才轮到 RPP（**终点朝向也归 RPP**）。⚠️ 门槛要**大于** RPP 的
      # rotate_to_heading_min_angle(0.785)；实测设 0.35 会卡在 -102.6°（两层互相拆台）。
      angular_dist_threshold: 1.5
      # 所以 RPP 的原地转速度也必须有保证（同名的 max_angular_accel 两层共用）：
      # 默认 3.2 ÷ 20 Hz = 0.16 rad/s，转 143° 要 15 s，会被 progress_checker 判死。
      max_angular_accel: 20.0
      rotate_to_heading_angular_vel: 1.0
      forward_sampling_distance: 0.5
      simulate_ahead_time: 1.0
      # —— 里面那个 RPP 的（同一个命名空间下，shim 会把参数转交给它）——
      desired_linear_vel: 0.4
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_regulated_linear_velocity_scaling: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # 控制器要等这张图"当前"才肯算下一拍 —— 它的频率实际上被这里卡着。
      update_frequency: 20.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # 有静态地图了 ⇒ 静态层 + **不滚动**。尺寸跟着地图走，所以这里**不写 width/height**。
      resolution: 0.05
      robot_radius: 0.25
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename 由 launch 文件传 —— 只有它知道这个包装到哪去了。
    topic_name: map
